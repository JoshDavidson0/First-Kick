name: Frontend CI/CD

# Runs on push to main only — never on pull requests.
# Scoped to frontend source paths so Lambda-only changes don't trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'types/**'
      - 'public/**'
      - '.github/workflows/frontend.yml'
      - 'package-lock.json'
  workflow_dispatch: # Allow manual trigger from GitHub UI, if needed.

# Least-privilege GITHUB_TOKEN — read-only access to repo contents.
# All AWS credentials come from GitHub Secrets, not from this token.
permissions:
  contents: read

jobs:
  ci-deploy:
    name: Type-check, lint, and deploy to Amplify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

    
