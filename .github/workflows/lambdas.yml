name: Lambdas CI/CD

# Runs on push to main only — never on pull requests.
# Scoped to the lambdas/ directory so frontend-only changes don't trigger this workflow.
on:
  push:
    branches: [main, test]
    paths:
      - 'lambdas/**'
      - '.github/workflows/lambdas.yml'

# Least-privilege GITHUB_TOKEN — read-only access to repo contents.
# All AWS credentials come from GitHub Secrets, not from this token.
permissions:
  contents: read

jobs:
  build-deploy:
    name: Build and deploy Lambda functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambdas/package-lock.json

      - name: Install Lambda dependencies
        working-directory: lambdas
        run: npm install

      - name: TypeScript build
        working-directory: lambdas
        run: npm run build

      # AWS credentials are injected from GitHub Secrets — never hardcoded here.
      # The IAM user behind these credentials is scoped to lambda:UpdateFunctionCode
      # and lambda:UpdateFunctionConfiguration only (security.md §7).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Each zip contains only the compiled function folder + shared utilities.
      # node_modules is intentionally excluded — AWS SDK v3 is pre-bundled in
      # the Lambda Node.js 20 managed runtime (architecture.md §5).

      - name: Deploy getRecommendation
        working-directory: lambdas/dist
        run: |
          zip -r getRecommendation.zip getRecommendation/ shared/
          aws lambda update-function-code \
            --function-name first-kick-getRecommendation \
            --zip-file fileb://$(pwd)/getRecommendation.zip

      - name: Deploy updateProgress
        working-directory: lambdas/dist
        run: |
          zip -r updateProgress.zip updateProgress/ shared/
          aws lambda update-function-code \
            --function-name first-kick-updateProgress \
            --zip-file fileb://$(pwd)/updateProgress.zip
